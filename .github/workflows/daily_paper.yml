name: Daily Scientific Paper to Notion

on:
  schedule:
    # Läuft jeden Tag um 08:00 Uhr UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Ermöglicht auch das manuelle Ausführen

jobs:
  update-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python main.py
